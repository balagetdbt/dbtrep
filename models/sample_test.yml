version: 2

models:
  - name: tst_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
  - name: tst_orders
    columns:
      - name: order_id
        tests:
         - unique
         - not_null
      - name: status
        tests:
          - accepted_values:
              values:
                - completed
                - shipped
                - returned
                - return_pending
                - placed
      - name: customer_id
        tests:
          - relationships:
              to: ref('tst_customers')
              field: customer_id